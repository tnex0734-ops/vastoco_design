<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%" fill="none" stroke="#3C2415" stroke-linecap="round" stroke-linejoin="round">
  <rect width="400" height="260" fill="#DDD9CE" rx="8" stroke="rgba(60, 36, 21, 0.22)" stroke-width="1"/>
  <!-- Architectural Drafting Grid -->
  <g stroke="rgba(60, 36, 21, 0.05)" stroke-width="0.75">
    <line x1="40" y1="0" x2="40" y2="260"/>
